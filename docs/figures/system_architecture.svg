<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300">
  <rect width="100%" height="100%" fill="#fcfcfc" rx="8" />
  <text x="370" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#722F37" text-anchor="middle">Pipeline Dataflow &amp; System Architecture</text>
  
  <rect x="30" y="80" width="140" height="150" rx="6" fill="#eef2f7" stroke="#335588" stroke-width="1.5" />
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#335588" text-anchor="middle">1. Ingestion</text>
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle">winequality-red.csv</text>
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle">1,599 raw rows</text>
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle">240 Dupes Purged</text>

  <line x1="170" y1="155" x2="210" y2="155" stroke="#722F37" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="210" y="80" width="140" height="150" rx="6" fill="#fdf6e2" stroke="#b58900" stroke-width="1.5" />
  <text x="280" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b58900" text-anchor="middle">2. Transform</text>
  <text x="280" y="140" font-family="Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle">Domain Features</text>
  <text x="280" y="160" font-family="Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle">StandardScaler</text>
  <text x="280" y="190" font-family="Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle">Stratified 80/20</text>

  <line x1="350" y1="155" x2="390" y2="155" stroke="#722F37" stroke-width="2" />

  <rect x="390" y="80" width="140" height="150" rx="6" fill="#f3e8f4" stroke="#722F37" stroke-width="1.5" />
  <text x="460" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#722F37" text-anchor="middle">3. Modeling</text>
  <text x="460" y="140" font-family="Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle">Random Forest</text>
  <text x="460" y="160" font-family="Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle">Gradient Boosting</text>
  <text x="460" y="190" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32" font-weight="bold" text-anchor="middle">ROC-AUC: 0.89</text>

  <line x1="530" y1="155" x2="570" y2="155" stroke="#722F37" stroke-width="2" />

  <rect x="570" y="80" width="140" height="150" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" />
  <text x="640" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">4. Serve</text>
  <text x="640" y="140" font-family="Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle">Joblib Serialization</text>
  <text x="640" y="160" font-family="Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle">Streamlit app.py</text>
  <text x="640" y="190" font-family="Arial, sans-serif" font-size="11" fill="#444" text-anchor="middle">Pytest CI Suite</text>

  <text x="370" y="270" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Automated CI runs via GitHub Actions on Python 3.10 and 3.11</text>
