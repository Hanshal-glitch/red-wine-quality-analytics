<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <rect width="100%" height="100%" fill="#ffffff" rx="8" />
  <text x="350" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#722F37" text-anchor="middle">Red Wine Quality Score Distribution (UCI Dataset)</text>
  <text x="350" y="58" font-family="Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">Deduplicated Total: 1,359 samples | Scores 3 to 8</text>
  
  <!-- Y-Axis Gridlines -->
  <line x1="80" y1="320" x2="650" y2="320" stroke="#e0e0e0" stroke-width="1" />
  <text x="70" y="324" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="end">0</text>
  <line x1="80" y1="260" x2="650" y2="260" stroke="#f0f0f0" stroke-width="1" />
  <text x="70" y="264" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="end">150</text>
  <line x1="80" y1="200" x2="650" y2="200" stroke="#f0f0f0" stroke-width="1" />
  <text x="70" y="204" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="end">300</text>
  <line x1="80" y1="140" x2="650" y2="140" stroke="#f0f0f0" stroke-width="1" />
  <text x="70" y="144" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="end">450</text>
  <line x1="80" y1="80" x2="650" y2="80" stroke="#f0f0f0" stroke-width="1" />
  <text x="70" y="84" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="end">600</text>

  <!-- Bars: (Score, Count, Bar Height calculated as Count * 0.4) -->
  <!-- Score 3: 10 count -> height 4 -->
  <rect x="110" y="316" width="60" height="4" fill="#d9534f" rx="4" />
  <text x="140" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">10</text>
  <text x="140" y="340" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">Score 3</text>

  <!-- Score 4: 53 count -> height 21 -->
  <rect x="200" y="299" width="60" height="21" fill="#f0ad4e" rx="4" />
  <text x="230" y="293" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">53</text>
  <text x="230" y="340" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">Score 4</text>

  <!-- Score 5: 577 count -> height 230 -->
  <rect x="290" y="90" width="60" height="230" fill="#722F37" rx="4" />
  <text x="320" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">577</text>
  <text x="320" y="340" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">Score 5</text>

  <!-- Score 6: 535 count -> height 214 -->
  <rect x="380" y="106" width="60" height="214" fill="#8b3a4a" rx="4" />
  <text x="410" y="98" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">535</text>
  <text x="410" y="340" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">Score 6</text>

  <!-- Score 7: 167 count -> height 66 -->
  <rect x="470" y="254" width="60" height="66" fill="#2e7d32" rx="4" />
  <text x="500" y="246" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">167</text>
  <text x="500" y="340" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">Score 7</text>

  <!-- Score 8: 17 count -> height 7 -->
  <rect x="560" y="313" width="60" height="7" fill="#1b5e20" rx="4" />
  <text x="590" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">17</text>
  <text x="590" y="340" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">Score 8</text>

  <!-- Legend -->
  <text x="350" y="375" font-family="Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">Normal/Table Wines (Scores 3-6: 86.5%)  |  Premium Quality (Scores 7-8: 13.5%)</text>
</svg>