  <text x="415" y="211" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">9.2%</text>

  <text x="210" y="245" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="end">free_sulfur_ratio</text>
  <rect x="220" y="230" width="174" height="22" fill="#c46b7d" rx="3" />
  <text x="405" y="246" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">8.7%</text>

  <text x="210" y="280" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="end">density</text>
  <rect x="220" y="265" width="162" height="22" fill="#d28292" rx="3" />
  <text x="393" y="281" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">8.1%</text>

  <text x="210" y="315" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="end">citric acid</text>
  <rect x="220" y="300" width="150" height="22" fill="#df9ca9" rx="3" />
  <text x="381" y="316" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">7.5%</text>

  <text x="210" y="350" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="end">chlorides</text>
  <rect x="220" y="335" width="138" height="22" fill="#ebb6c1" rx="3" />
  <text x="369" y="351" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">6.9%</text>

  <text x="210" y="385" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="end">total sulfur dioxide</text>
  <rect x="220" y="370" width="126" height="22" fill="#f5d0d9" rx="3" />
  <text x="357" y="386" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">6.3%</text>

