  <text x="210" y="140" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="end">sulphates</text>
  <rect x="220" y="125" width="256" height="22" fill="#8b3a4a" rx="3" />
  <text x="487" y="141" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">12.8%</text>

  <text x="210" y="175" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="end">volatile acidity</text>
  <rect x="220" y="160" width="228" height="22" fill="#a04759" rx="3" />
  <text x="459" y="176" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">11.4%</text>

  <text x="210" y="210" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="end">total_acidity</text>
